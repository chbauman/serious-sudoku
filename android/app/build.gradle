apply plugin: 'com.android.application'

// In GitHub Actions the run number is the version code, so every CI build is
// newer than the previous one (a debug APK can be installed over an older
// one) and the version name shows which build is installed. Local builds keep
// the version code 1: installing one over a CI build is a downgrade, which
// needs `adb install -r -d`.
def ciRun = System.getenv("GITHUB_RUN_NUMBER")
def ciCommit = (System.getenv("GITHUB_SHA") ?: "").take(7)

// The APK is named after the app and the version, e.g.
// serious-sudoku-1.1-build57-1a2b3c4-debug.apk (serious-sudoku-1.1-local-debug.apk
// for a local build)
base {
    archivesName = "serious-sudoku-" + (ciRun ? "1.1-build${ciRun}-${ciCommit}" : "1.1-local")
}

android {
    namespace = "ch.chrisbaumann.sudoku"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ch.chrisbaumann.sudoku"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play Store releases need an increasing versionCode: the release workflow
        // sets VERSION_CODE / VERSION_NAME (see .github/workflows/android-release.yml)
        versionCode(Integer.parseInt(System.getenv("VERSION_CODE") ?: (ciRun ?: "1")))
        versionName(System.getenv("VERSION_NAME") ?: (ciRun ? "1.1 (build ${ciRun}, ${ciCommit})" : "1.1"))
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // The same debug key for every build (CI and local), so that a debug APK
        // can be installed over an older one (an update keeps the app data).
        // Not a secret; debug.keystore is committed on purpose.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeType 'pkcs12'
        }
        // Release signing (upload key), only when the keystore is provided by CI
        release {
            if (System.getenv("ANDROID_KEYSTORE_FILE")) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv("ANDROID_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
