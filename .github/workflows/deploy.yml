name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One deployment at a time, they all push to the gh-pages branch
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run assemble
      # The test build of a branch (deploy-dev.yml) lives in dev/ of the branch
      # and must survive the deployment of main
      - name: Keep the test build
        run: |
          git fetch --depth=1 origin gh-pages || true
          git checkout FETCH_HEAD -- dev 2>/dev/null && mv dev _site/dev || true
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
